name: Flatpak

# Builds the GNOME flatpak from build-aux/flatpak, the strictest test of the
# clone-and-build promise: the sandbox has no network during the build, so
# anything the manifest does not declare is simply absent. The result is
# bundled into a single installable file and kept as an artifact:
#
#   flatpak install --user online.fujinet.go.pmd85.gnome.flatpak
#
# (the bundle names Flathub as its runtime repository, so the GNOME runtime
# comes from there on a machine that has not set Flathub up).
#
# After the family's flatpak.yml (fujinet-go-atari800-desktop and
# fujinet-go-coco-desktop), on a GitHub-hosted runner: a privileged Ubuntu
# container, which flatpak-builder's bubblewrap sandbox needs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - build-aux/flatpak/online.fujinet.go.pmd85.gnome.yml
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
      options: --privileged
    steps:
      - name: Install flatpak and flatpak-builder
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl \
            flatpak flatpak-builder elfutils unzip
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - uses: actions/checkout@v4

      - name: Install the runtime and SDK this manifest targets
        run: |
          runtime=$(sed -n 's/^runtime: *//p' "${{ matrix.manifest }}")
          runtime_version=$(sed -n "s/^runtime-version: *'\(.*\)'/\1/p" "${{ matrix.manifest }}")
          sdk=$(sed -n 's/^sdk: *//p' "${{ matrix.manifest }}")
          flatpak install -y --user flathub \
            "${runtime}/x86_64/${runtime_version}" \
            "${sdk}/x86_64/${runtime_version}"

      - name: Build and export to a local repo
        run: |
          flatpak-builder --user --force-clean --repo=repo \
            --disable-rofiles-fuse build-flatpak "${{ matrix.manifest }}"

      - name: Bundle into a single installable file
        id: bundle
        run: |
          app_id=$(sed -n 's/^app-id: *//p' "${{ matrix.manifest }}")
          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "${app_id}.flatpak" "${app_id}" master
          echo "app_id=${app_id}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ steps.bundle.outputs.app_id }}
          path: '*.flatpak'
          if-no-files-found: error
